apiVersion: apps/v1
kind: Deployment
metadata:
  name: msinventario
  labels:
    app.kubernetes.io/name: msinventario
    app.kubernetes.io/part-of: inventario
spec:
  # Réplicas iniciales; luego el HPA las ajusta entre 2 y 6 según la carga
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: msinventario
  # Despliegue sin caída: se levanta un pod nuevo antes de bajar uno viejo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msinventario
        app.kubernetes.io/part-of: inventario
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Seguridad del pod: nunca como root. La imagen define el usuario "app"
      # (no numérico), por eso se fija un UID para que Kubernetes pueda verificarlo.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Reparte las réplicas entre nodos cuando hay más de uno
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: msinventario
      containers:
        - name: msinventario
          # La etiqueta real la fija el pipeline en kustomization.yaml (sha del commit)
          image: msinventario
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: msinventario-config
          # Límites de recursos: requests = lo reservado; limits = el máximo permitido
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # startupProbe: da tiempo a que arranque Spring Boot antes de las otras probes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # livenessProbe: si el proceso se cuelga, Kubernetes reinicia el contenedor
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe: el pod solo recibe tráfico cuando está listo
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Espera breve antes de apagar para que el Service deje de enviarle tráfico
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # El sistema de archivos es de solo lectura; Tomcat necesita /tmp escribible
        - name: tmp
          emptyDir: {}
