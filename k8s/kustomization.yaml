apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventario

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# El pipeline reemplaza newName/newTag por la imagen exacta construida
# (ghcr.io/<owner>/msinventario:sha-<commit>) antes de aplicar.
images:
  - name: msinventario
    newName: msinventario
    newTag: local
