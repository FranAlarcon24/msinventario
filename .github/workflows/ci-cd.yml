# =============================================================================
# Pipeline CI/CD - Spring Boot (msinventario)
#
#   Snyk Security Scan ─────────┐
#                               ├─> SonarCloud Analysis ─> Build Jar ─> Docker Image (build + Snyk Container
#   Run Tests (JUnit + JaCoCo) ─┘                                        + health + push GHCR)
#                                                                         ─> Deploy Staging (Docker Compose)
#                                                                         ─> Deploy Kubernetes (kind)
#   (solo en PR) Dependency Review
#
# Cada job depende del anterior (needs): si una etapa falla, el pipeline se detiene
# y la imagen NO se publica.
# Artefactos generados: test-reports, jacoco-report, snyk-report, snyk-container-report, app-jar
# =============================================================================
name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main            # El pipeline completo (con publicación de la imagen) corre al hacer push a 'main'
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main            # En los PR se valida (pruebas + imagen) sin publicar
  workflow_dispatch:     # Permite ejecutarlo manualmente desde la pestaña Actions

# Principio de mínimo privilegio: cada job pide solo los permisos que necesita
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "17"

jobs:
  # ===========================================================================
  # 0. Análisis de seguridad con Snyk (SCA: dependencias + SAST: código propio)
  #    Corre en paralelo con las pruebas. Si encuentra algo alto o crítico, BLOQUEA.
  # ===========================================================================
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # publicar hallazgos en la pestaña Security
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}   # Token guardado en GitHub Secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verificar que existe SNYK_TOKEN
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error title=Falta SNYK_TOKEN::Configura el secreto SNYK_TOKEN en Settings > Secrets and variables > Actions (y también en Dependabot)."
            exit 1
          fi

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk CLI
        run: snyk auth "$SNYK_TOKEN"

      - name: Snyk test Java dependencies (SCA)
        id: sca
        continue-on-error: true   # el bloqueo se aplica en el último paso, después de guardar reportes
        run: |
          chmod +x mvnw
          snyk test --severity-threshold=high \
            --json-file-output=snyk-report.json \
            --sarif-file-output=snyk-sca.sarif

      - name: Snyk Code - análisis estático del código (SAST)
        id: sast
        continue-on-error: true
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-report
          path: |
            snyk-report.json
            snyk-*.sarif
          if-no-files-found: warn

      - name: Publicar hallazgos SCA en GitHub Security
        if: always() && hashFiles('snyk-sca.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source

      - name: Publicar hallazgos SAST en GitHub Security
        if: always() && hashFiles('snyk-code.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Snyk monitor (monitoreo continuo y alertas por correo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: snyk monitor --project-name=msinventario --target-reference=main

      - name: Quality gate de seguridad (BLOQUEO)
        run: |
          {
            echo "### Quality gate de seguridad (umbral: severidad alta)"
            echo "| Análisis | Resultado |"
            echo "|---|---|"
            echo "| Snyk Open Source (dependencias) | ${{ steps.sca.outcome }} |"
            echo "| Snyk Code (SAST) | ${{ steps.sast.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sca.outcome }}" != "success" ] || [ "${{ steps.sast.outcome }}" != "success" ]; then
            echo "::error title=Seguridad::Se encontraron vulnerabilidades de severidad alta o crítica. Pipeline bloqueado."
            exit 1
          fi

  # ===========================================================================
  # 1. Pruebas unitarias e integración + cobertura con JaCoCo
  #    "mvnw verify" falla si una prueba falla o si la cobertura de líneas
  #    baja del mínimo definido en el pom.xml (cobertura.minima = 70 %).
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven      # cachea ~/.m2 entre ejecuciones

      - name: Build and test (pruebas + reporte JaCoCo + cobertura mínima 70 %)
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B -ntp

      - name: Publicar resultados de pruebas
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true

      - name: Resumen de cobertura (JaCoCo)
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            read -r MISS COV < <(awk -F, 'NR>1 {m+=$8; c+=$9} END {print m, c}' "$CSV")
            PCT=$(awk -v c="$COV" -v m="$MISS" 'BEGIN {printf "%.1f", (c*100)/(c+m)}')
            {
              echo "### Cobertura de pruebas (JaCoCo)"
              echo "| Métrica | Valor |"
              echo "|---|---|"
              echo "| Líneas cubiertas | $COV |"
              echo "| Líneas sin cubrir | $MISS |"
              echo "| **Cobertura de líneas** | **$PCT %** (mínimo exigido: 70 %) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ===========================================================================
  # Solo en Pull Requests: bloquea dependencias nuevas con vulnerabilidades
  # ===========================================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ===========================================================================
  # 1b. Análisis de calidad con SonarCloud (opcional: se omite si no hay SONAR_TOKEN)
  #     Usa el reporte de JaCoCo para medir la cobertura y espera el Quality Gate.
  # ===========================================================================
  sonar-analysis:
    name: SonarCloud Analysis
    needs: [test, snyk-scan]   # Solo se ejecuta si pasaron las pruebas y la seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Token SonarCloud desde Secrets
    steps:
      - name: Verificar configuración de SonarCloud
        id: cfg
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning title=SonarCloud omitido::No existe el secreto SONAR_TOKEN; se omite el análisis de SonarCloud."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # SonarCloud necesita el historial completo (blame, código nuevo)

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run SonarCloud Analysis (con Quality Gate)
        if: steps.cfg.outputs.enabled == 'true'
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # Por defecto SonarCloud crea el proyecto como <owner>_<repo> en la organización <owner>
          KEY="${SONAR_PROJECT_KEY:-${GITHUB_REPOSITORY_OWNER}_${REPO}}"
          ORG="${SONAR_ORGANIZATION:-$OWNER}"
          chmod +x mvnw
          ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="$KEY" \
            -Dsonar.organization="$ORG" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true


  # ===========================================================================
  # 2. Empaquetado de la aplicación
  # ===========================================================================
  build:
    name: Build Jar
    # Solo se ejecuta si pasan las pruebas, el análisis de seguridad y el de calidad
    needs: [test, snyk-scan, sonar-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B -ntp   # Empaqueta sin volver a ejecutar pruebas

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar    # Sube el .jar como artefacto del pipeline

  # ===========================================================================
  # 3. Imagen Docker: build multi-stage, prueba de health y publicación en GHCR
  # ===========================================================================
  docker-image:
    name: Docker Image (build, test, push)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # publicar en GitHub Container Registry (GHCR)
      security-events: write   # publicar hallazgos de Snyk Container en la pestaña Security
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Calcular nombre y etiqueta de la imagen
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/msinventario" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Metadatos y etiquetas (sha, rama, latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # incluye el commit (org.opencontainers.image.revision)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk Container - vulnerabilidades en la imagen
        id: container
        continue-on-error: true   # el bloqueo se aplica en el quality gate, después de guardar el reporte
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}" \
            --file=Dockerfile --severity-threshold=high \
            --json-file-output=snyk-container-report.json \
            --sarif-file-output=snyk-container.sarif

      - name: Upload Snyk Container Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-container-report
          path: snyk-container-report.json
          if-no-files-found: warn

      - name: Publicar hallazgos de la imagen en GitHub Security
        if: always() && hashFiles('snyk-container.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container

      - name: Quality gate de la imagen (BLOQUEO)
        run: |
          echo "| Snyk Container (imagen) | ${{ steps.container.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.container.outcome }}" != "success" ]; then
            echo "::error title=Imagen insegura::La imagen tiene vulnerabilidades altas o críticas. No se publica."
            exit 1
          fi

      - name: Prueba de humo de la imagen (/actuator/health)
        run: |
          docker run -d --name msinventario-test -p 8080:8080 "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Health check OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Health check::El contenedor no respondió UP en /actuator/health"
          docker logs msinventario-test
          exit 1

      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          while read -r t; do
            [ -n "$t" ] && docker push "$t"
          done <<< "${{ steps.meta.outputs.tags }}"
          {
            echo "### Imagen publicada"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ejecución | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 4. Despliegue automático en entorno simulado (staging) con Docker Compose
  # ===========================================================================
  deploy-staging:
    name: Deploy Staging (Docker Compose)
    needs: docker-image
    if: github.event_name != 'pull_request'   # Solo se despliega lo que llega a main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      # Se despliega exactamente la imagen construida en este pipeline (trazable al commit)
      IMAGE: ${{ needs.docker-image.outputs.image }}:${{ needs.docker-image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar stack (nginx + 2 réplicas)
        run: |
          docker compose pull
          docker compose up -d --no-build --wait --wait-timeout 300
          docker compose ps

      - name: Prueba de humo
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Prueba de escalabilidad (escalar a 3 réplicas)
        run: |
          docker compose up -d --no-build --scale app=3 --wait --wait-timeout 300
          REPLICAS=$(docker compose ps app --status running -q | wc -l)
          echo "Réplicas en ejecución: $REPLICAS"
          [ "$REPLICAS" -eq 3 ] || { echo "::error::No se alcanzaron 3 réplicas"; exit 1; }
          bash scripts/smoke-test.sh http://localhost:8080
          {
            echo "### Staging (Docker Compose) desplegado"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${IMAGE}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Réplicas | $REPLICAS |"
            echo '```'
            docker compose ps
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs en caso de falla
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Bajar entorno
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # 5. Despliegue automático en Kubernetes (clúster kind = producción simulada)
  #    Solo en push a main y después de que staging pase: usa exactamente la
  #    misma imagen publicada y probada en los jobs anteriores.
  # ===========================================================================
  deploy-k8s:
    name: Deploy Kubernetes (kind)
    needs: [docker-image, deploy-staging]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production   # historial de despliegues en Settings > Environments
    permissions:
      contents: read
      packages: read           # descargar la imagen desde GHCR
    env:
      IMAGE: ${{ needs.docker-image.outputs.image }}
      TAG: ${{ needs.docker-image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Crear clúster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: inventario

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargar la imagen publicada en el clúster
        run: |
          docker pull "$IMAGE:$TAG"
          kind load docker-image "$IMAGE:$TAG" --name inventario

      - name: Instalar metrics-server (necesario para el HPA)
        continue-on-error: true
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Renderizar manifiestos con la imagen exacta (trazabilidad)
        env:
          CAUSA: "commit ${{ github.sha }} | run ${{ github.run_id }} | ${{ needs.docker-image.outputs.image }}:${{ needs.docker-image.outputs.tag }}"
        run: |
          sed -i "s|newName: .*|newName: ${IMAGE}|; s|newTag: .*|newTag: ${TAG}|" k8s/kustomization.yaml
          kubectl kustomize k8s > manifiesto-renderizado.yaml
          # Anota en el Deployment qué commit y qué ejecución lo generaron (kubectl rollout history)
          yq -i '(select(.kind == "Deployment") | .metadata.annotations."kubernetes.io/change-cause") = strenv(CAUSA)' manifiesto-renderizado.yaml
          yq -i '(select(.kind == "Deployment") | .spec.template.metadata.annotations."inventario/commit") = strenv(GITHUB_SHA)' manifiesto-renderizado.yaml
          grep -n "image:" manifiesto-renderizado.yaml

      - name: Desplegar en Kubernetes
        run: |
          kubectl apply -f manifiesto-renderizado.yaml
          kubectl -n inventario rollout status deployment/msinventario --timeout=300s

      - name: Prueba de humo a través del Service
        run: |
          kubectl -n inventario port-forward svc/msinventario 8081:80 > port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8081/actuator/health | grep -q '"status":"UP"' && break
            [ "$i" -eq 30 ] && { echo "::error::El servicio no respondió UP"; exit 1; }
            sleep 2
          done
          echo "Health OK"
          curl -fsS -o /dev/null http://localhost:8081/api/productos && echo "GET /api/productos OK"
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/productos \
            -H 'Content-Type: application/json' -d '{"nombre":"Smoke test","stock":1,"precio":1000}')
          [ "$CODIGO" = "201" ] || { echo "::error::POST esperaba 201 y recibió $CODIGO"; exit 1; }
          echo "POST /api/productos OK (201)"
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/productos \
            -H 'Content-Type: application/json' -d '{"nombre":"","stock":-1,"precio":0}')
          [ "$CODIGO" = "400" ] || { echo "::error::Validación esperaba 400 y recibió $CODIGO"; exit 1; }
          echo "Validación OK (400)"

      - name: Prueba de escalabilidad (escalar a 3 réplicas)
        run: |
          kubectl -n inventario scale deployment/msinventario --replicas=3
          kubectl -n inventario rollout status deployment/msinventario --timeout=300s
          LISTAS=$(kubectl -n inventario get deployment msinventario -o jsonpath='{.status.readyReplicas}')
          echo "Réplicas listas: $LISTAS"
          [ "$LISTAS" -ge 3 ] || { echo "::error::No se alcanzaron 3 réplicas listas"; exit 1; }

      - name: Evidencia del despliegue
        if: always()
        run: |
          {
            echo "### Despliegue en Kubernetes (kind)"
            echo "Imagen: \`${IMAGE}:${TAG}\` · Commit: \`${GITHUB_SHA}\`"
            echo '```'
            kubectl -n inventario get deploy,rs,pods,svc,hpa,pdb -o wide 2>&1 || true
            echo
            kubectl -n inventario rollout history deployment/msinventario 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico en caso de falla
        if: failure()
        run: |
          kubectl -n inventario get events --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n inventario describe pods || true
          kubectl -n inventario logs deploy/msinventario --tail=200 || true

      - name: Guardar manifiesto desplegado
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manifiesto-k8s
          path: manifiesto-renderizado.yaml
          if-no-files-found: warn
